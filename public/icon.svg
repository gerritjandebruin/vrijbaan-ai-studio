<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="portalBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Road Portal Beam -->
  <rect x="56" y="110" width="400" height="20" rx="4" fill="url(#portalBeam)" />
  <rect x="76" y="110" width="16" height="290" rx="4" fill="#334155" />
  <rect x="420" y="110" width="16" height="290" rx="4" fill="#334155" />

  <!-- Highway Lane Lines in perspective -->
  <path d="M 120 420 L 220 280 L 292 280 L 392 420 Z" fill="#1e293b" opacity="0.6" />
  <line x1="256" y1="290" x2="256" y2="410" stroke="#38bdf8" stroke-dasharray="14 14" stroke-width="6" />

  <!-- Matrix Sign Enclosure Left (100 in red ring) -->
  <rect x="140" y="125" width="105" height="105" rx="10" fill="#000000" stroke="#475569" stroke-width="3" />
  <!-- Red Ring -->
  <circle cx="192.5" cy="177.5" r="42" fill="none" stroke="#dc2626" stroke-width="9" />
  <!-- 100 text in matrix LED font style -->
  <text x="192.5" y="186" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">100</text>

  <!-- Matrix Sign Enclosure Right (Green open arrow or 100) -->
  <rect x="267" y="125" width="105" height="105" rx="10" fill="#000000" stroke="#475569" stroke-width="3" />
  <circle cx="319.5" cy="177.5" r="42" fill="none" stroke="#dc2626" stroke-width="9" />
  <text x="319.5" y="186" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">100</text>

  <!-- Wordmark bottom -->
  <text x="256" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">VRIJBAAN</text>
</svg>
